<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALPINESTORES — Connection Test</title>
  <style>
    body {
      background: #050505; color: #fff; font-family: Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; text-align: center; padding: 20px;
    }
    h1 { color: #F5C518; letter-spacing: 4px; }
    .ok { color: #4ade80; }
    .bad { color: #f87171; }
    code { background: #1a1a1a; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div>
    <h1>ALPINESTORES</h1>
    <p id="status">Testing connection to Appwrite...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
  <script src="config.js"></script>
  <script>
    const statusEl = document.getElementById("status");

    databases
      .listDocuments(CONFIG.databaseId, CONFIG.carsCollectionId)
      .then((res) => {
        statusEl.className = "ok";
        statusEl.textContent =
          "✅ Connected! Cars in database: " + res.total;
      })
      .catch((err) => {
        statusEl.className = "bad";
        statusEl.innerHTML =
          "❌ Connection failed:<br><code>" + err.message + "</code>";
      });
  </script>
</body>
</html>
